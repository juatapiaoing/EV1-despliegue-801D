# ============================================================
# CD - Despliegue continuo de ms-prestamos con Docker Compose
# ============================================================
# Se ejecuta en cada push a main (es decir, al cerrar un release o un hotfix)
# y a mano desde la pestana Actions.
#
# El "entorno cloud simulado" es el propio runner de GitHub Actions: levanta
# el stack de compose.yaml (proxy + API + MySQL) tal como correria en un
# servidor, comprueba que funciona de punta a punta y deja registrado en el
# resumen del run que version y que commit quedaron desplegados.
#
# Trazabilidad: el commit de main -> la version del pom.xml -> la imagen
# ms-prestamos:<commit> (con version y commit grabados como etiquetas) -> el
# despliegue registrado en Settings > Environments > produccion.
# ============================================================
name: CD - Despliegue con Docker Compose

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nunca dos despliegues a la vez.
concurrency:
  group: despliegue
  cancel-in-progress: false

jobs:
  deploy:
    name: Desplegar en el entorno simulado
    runs-on: ubuntu-latest
    # Deja el despliegue registrado en la pestana Deployments del repositorio.
    environment: produccion

    steps:
      - name: Obtener el codigo
        uses: actions/checkout@v4

      # La version sale del pom.xml y el commit del evento: asi la imagen queda
      # identificada sin pasos manuales.
      - name: Calcular version y commit
        run: |
          version=$(awk '/<artifactId>ms-prestamos<\/artifactId>/{getline; print}' pom.xml | sed -E 's/.*<version>(.*)<\/version>.*/\1/')
          {
            echo "VERSION=${version}"
            echo "GIT_SHA=${GITHUB_SHA}"
            echo "IMAGE_TAG=${GITHUB_SHA::7}"
          } >> "$GITHUB_ENV"

      # Las credenciales se generan en cada despliegue: no viajan por el
      # repositorio ni por los secretos.
      - name: Generar las credenciales del despliegue
        run: |
          {
            echo "DB_PASSWORD=$(openssl rand -hex 16)"
            echo "MYSQL_ROOT_PASSWORD=$(openssl rand -hex 16)"
          } > .env

      - name: Desplegar con Docker Compose
        run: docker compose up -d --build

      - name: Verificar el despliegue
        run: |
          docker compose ps
          for i in $(seq 1 24); do
            if curl -fsS http://localhost:9005/actuator/health | grep '"status":"UP"' >/dev/null; then
              echo "Servicio UP"
              break
            fi
            [ "$i" -eq 24 ] && { echo "El servicio no respondio UP en 120 s"; exit 1; }
            echo "Esperando al servicio... ($i/24)"
            sleep 5
          done

          # Prueba de humo de punta a punta: proxy -> API -> MySQL.
          inicio=$(date +%F); fin=$(date -d '+14 days' +%F)
          curl -fsS -X POST http://localhost:9005/api/v1/prestamos \
            -H 'Content-Type: application/json' \
            -d "{\"codigoLibro\":\"CD-0001\",\"rutUsuario\":\"18345678-9\",\"fechaPrestamo\":\"${inicio}\",\"fechaVencimiento\":\"${fin}\"}"
          echo
          curl -fsS http://localhost:9005/api/v1/prestamos/usuario/18345678-9 | grep 'CD-0001' >/dev/null
          echo "Prestamo registrado y leido desde MySQL"

      - name: Registrar la trazabilidad en el resumen del run
        run: |
          {
            echo "### Despliegue"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`${VERSION}\` |"
            echo "| Commit | \`${GIT_SHA}\` |"
            echo "| Imagen | \`ms-prestamos:${IMAGE_TAG}\` |"
            echo "| Version informada por la API | \`$(curl -fsS http://localhost:9005/actuator/info | grep -o '"version":"[^"]*"')\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Mostrar los logs si algo fallo
        if: failure()
        run: docker compose logs --tail 80

      - name: Retirar el entorno
        if: always()
        run: docker compose down -v
