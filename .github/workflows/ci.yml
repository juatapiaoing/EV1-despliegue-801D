# ============================================================
# CI - Integracion continua de ms-prestamos
# ============================================================
# Se ejecuta en:
#   - cada push a develop        -> valida la rama de integracion
#   - cada pull request a main    -> bloquea releases/hotfixes rotos
#   - cada pull request a develop -> valida las features antes del merge
#
# Dos jobs encadenados:
#   build   compila, corre las pruebas y empaqueta el .jar.
#   imagen  construye la imagen Docker y comprueba que el contenedor arranca;
#           solo corre si build termino en verde.
# Las pruebas usan H2 en memoria (perfil dev), por lo que el runner
# no necesita base de datos ni ningun servicio externo.
# ============================================================
name: CI - Build y pruebas

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build:
    name: Compilar y probar (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Obtener el codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Dar permiso de ejecucion al Maven Wrapper
        run: chmod +x mvnw

      - name: Compilar, probar y empaquetar
        run: ./mvnw -B clean verify

      # Se ejecuta aunque falle el umbral: el reporte de JaCoCo se genera antes
      # de la verificacion, asi el resumen muestra cuanto falto.
      - name: Resumir la cobertura en el run
        if: always()
        run: |
          csv=target/site/jacoco/jacoco.csv
          [ -f "$csv" ] || exit 0
          awk -F, 'NR>1 { lm+=$8; lc+=$9; bm+=$6; bc+=$7 } END {
            printf "### Cobertura de pruebas (JaCoCo)\n\n| Metrica | Cobertura |\n|---|---|\n"
            printf "| Lineas | %.1f %% (%d de %d) |\n", 100*lc/(lm+lc), lc, lm+lc
            printf "| Ramas | %.1f %% (%d de %d) |\n", (bm+bc > 0 ? 100*bc/(bm+bc) : 100), bc, bm+bc
          }' "$csv" >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-surefire
          path: target/surefire-reports/
          retention-days: 7

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura
          path: target/site/jacoco/
          retention-days: 7

      - name: Publicar artefacto .jar
        uses: actions/upload-artifact@v4
        with:
          name: ms-prestamos-jar
          path: target/ms-prestamos-*.jar
          retention-days: 7

  imagen:
    name: Construir imagen Docker
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Obtener el codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Calcular la fecha de construccion
        run: echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      # No se publica: solo se construye y se carga en el daemon del runner
      # para probarla. La publicacion en el registro llega con el CD.
      # En un PR, github.sha es el commit de merge temporal; el SHA real de la
      # rama esta en pull_request.head.sha.
      - name: Construir la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ms-prestamos:ci
          build-args: |
            GIT_SHA=${{ github.event.pull_request.head.sha || github.sha }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Prueba de humo: la imagen arranca con el perfil dev (H2) y el
      # healthcheck de Actuator responde UP.
      - name: Probar que el contenedor arranca
        run: |
          docker run -d --name smoke -p 9005:9005 ms-prestamos:ci
          for i in $(seq 1 24); do
            if curl -fsS http://localhost:9005/actuator/health | grep -q '"status":"UP"'; then
              echo "Contenedor UP"
              exit 0
            fi
            echo "Esperando al contenedor... ($i/24)"
            sleep 5
          done
          echo "El contenedor no respondio UP en 120 s"
          docker logs smoke
          exit 1

      - name: Comprobar que no corre como root
        run: |
          usuario=$(docker exec smoke id -u)
          echo "UID del proceso: ${usuario}"
          test "${usuario}" != "0"
