# ============================================================
# Orquestacion de ms-prestamos con Docker Compose
# ============================================================
# Tres servicios:
#   proxy  nginx: unico punto de entrada (puerto 9005) y balanceador.
#   app    la API de prestamos; se puede replicar.
#   db     MySQL con los datos en un volumen.
#
#   cp .env.example .env                    una sola vez: define las credenciales
#   docker compose up -d --build            construye la imagen y levanta todo
#   docker compose up -d --scale app=3      escala la API a 3 replicas
#   docker compose ps                       estado y salud de cada contenedor
#   docker compose down                     detiene todo (los datos quedan en el volumen)
#   docker compose down -v                  detiene todo y borra tambien los datos
# ============================================================
name: ms-prestamos

services:
  proxy:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "9005:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

  app:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
        GIT_SHA: ${GIT_SHA:-local}
    image: ms-prestamos:${IMAGE_TAG:-local}
    restart: unless-stopped
    # Sin "ports": la API solo se alcanza a traves del proxy, y por eso puede
    # tener varias replicas sin pelearse por un puerto del anfitrion.
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: db
      DB_NAME: ${DB_NAME:-prestamos}
      DB_USER: ${DB_USER:-prestamos_app}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en el archivo .env}
    # La API espera a que MySQL responda; el HEALTHCHECK de la imagen informa
    # luego si la API esta sana.
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-prestamos}
      MYSQL_USER: ${DB_USER:-prestamos_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en el archivo .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD en el archivo .env}
    # Sin "ports": MySQL solo es alcanzable desde la red interna de Compose, no
    # desde el anfitrion ni desde internet.
    volumes:
      - mysql-data:/var/lib/mysql
    # Consulta por TCP (127.0.0.1) para no darse por listo con el servidor
    # temporal que la imagen levanta durante la inicializacion.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

volumes:
  mysql-data:
