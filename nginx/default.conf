# Reparte las peticiones entre las replicas de la API.
# Docker resuelve el nombre "app" a la IP de cada replica; con el resolver,
# nginx vuelve a consultar el DNS cada 5 s, asi que "--scale app=N" se nota sin
# reiniciar nginx. El log muestra que replica atendio cada peticion.
log_format con_replica '$remote_addr "$request" $status -> replica $upstream_addr';

server {
    listen 80;
    access_log /dev/stdout con_replica;

    resolver 127.0.0.11 valid=5s;

    location / {
        set $api http://app:9005;
        # Sin esto la API arma los enlaces HATEOAS con el nombre interno (app).
        proxy_set_header Host $http_host;
        proxy_pass $api;
    }
}
