# ============================================================
# Perfil dev - Desarrollo local y ejecucion de tests en CI
# ============================================================
# Usa H2 en memoria a proposito: el pipeline de GitHub Actions
# debe poder compilar y correr los tests sin levantar una base
# de datos, y quien clone el repositorio no necesita instalar
# MySQL para probar la API.
# ============================================================

spring:
  datasource:
    url: jdbc:h2:mem:prestamosdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      # create-drop: el esquema se recrea en cada arranque. Aceptable porque
      # los datos de este perfil son de prueba y se recargan desde data.sql.
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    # Sin esta linea, data.sql se ejecutaria ANTES de que Hibernate cree las
    # tablas y el arranque fallaria con "table PRESTAMOS not found".
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

logging:
  level:
    cl.jctapia.prestamos: DEBUG
