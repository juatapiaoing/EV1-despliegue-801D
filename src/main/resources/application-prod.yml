# ============================================================
# Perfil prod - Instancia EC2 con MySQL
# ============================================================
# Ningun valor sensible esta escrito en el archivo: la URL, el
# usuario y la password se inyectan como variables de entorno
# desde la unidad de systemd. Asi las credenciales del servidor
# nunca viajan al repositorio Git.
# ============================================================

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:prestamos}?useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 20000

  jpa:
    hibernate:
      # update y no create-drop: en produccion los datos deben sobrevivir a un
      # reinicio del servicio. Hibernate solo agrega lo que falta del esquema.
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: false

  sql:
    init:
      # Los datos de prueba de data.sql no deben cargarse en produccion.
      mode: never

logging:
  level:
    root: INFO
    cl.jctapia.prestamos: INFO
