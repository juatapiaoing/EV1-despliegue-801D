# ============================================================
# ms-prestamos - Configuracion comun a todos los perfiles
# ============================================================
# Lo especifico de cada entorno vive en application-dev.yml y
# application-prod.yml. Aqui solo va lo que no cambia nunca.
# ============================================================

spring:
  application:
    name: ms-prestamos

  # El perfil se toma de la variable de entorno para no tener que recompilar
  # el .jar al desplegar: en la instancia EC2 se define SPRING_PROFILES_ACTIVE
  # en la unidad de systemd. Si nadie la define, se asume desarrollo local.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jackson:
    # Los prestamos vigentes no tienen fecha de devolucion. Omitir los nulos
    # deja el JSON limpio en lugar de llenarlo de "campo": null.
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:9005}
  error:
    # Nunca exponer el stacktrace al cliente: revela rutas de clases y version
    # de las librerias, informacion util para un atacante.
    include-stacktrace: never

# ── Documentacion OpenAPI / Swagger UI ───────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# ── Actuator ─────────────────────────────────────────────────
# Solo se exponen health e info. El resto de endpoints (env, beans,
# mappings) filtraria configuracion interna del servicio.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    nombre: ms-prestamos
    descripcion: Microservicio de gestion de prestamos de biblioteca
    version: 1.0.0
